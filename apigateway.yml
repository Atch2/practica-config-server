server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${random.value}

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: micro-server-categorias
              uri: lb://CATEGORIAS
              predicates:
                - Path=/api/categorias/**
            - id: micro-server-productos
              uri: lb://PRODUCTOS
              predicates:
                - Path=/api/productos/**
