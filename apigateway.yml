server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${random.value}

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: micro-server-nombres
              uri: lb://ANTHONY
              predicates:
                - Path=/nombres,/nombres/**
            - id: micro-server-apellidos
              uri: lb://CHANGOTASIG
              predicates:
                - Path=/apellidos,/apellidos/**
